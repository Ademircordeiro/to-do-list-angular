<li class="task-item" [class.completed]="task.completed" [class.is-editing]="isEditing">
  <!-- Checkbox de Conclusão -->
  <label class="checkbox-container">
    <input
      type="checkbox"
      [checked]="task.completed"
      (change)="toggleComplete()"
      [attr.aria-label]="'Marcar ' + task.title + ' como concluída'"
    />
    <span class="custom-checkbox">
      <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </span>
  </label>

  <!-- Conteúdo da Tarefa -->
  <div class="task-content">
    @if (!isEditing) {
      <div class="task-title-row">
        <span class="task-title" (dblclick)="startEdit()" title="Clique duplo para editar">
          {{ task.title }}
        </span>
      </div>

      <div class="task-meta">
        <!-- Categoria -->
        @if (task.category) {
          <span class="badge category-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
              <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
            {{ task.category }}
          </span>
        }

        <!-- Prioridade -->
        <span class="badge priority-badge" [class]="'priority-' + task.priority">
          {{ priorityLabel }}
        </span>

        <!-- Data -->
        <span class="task-date">
          {{ formattedDate }}
        </span>
      </div>
    } @else {
      <!-- Modo de Edição -->
      <div class="edit-box">
        <input
          type="text"
          [(ngModel)]="editTitle"
          (keydown.enter)="saveEdit()"
          (keydown.escape)="cancelEdit()"
          class="edit-input"
          autofocus
        />
        <div class="edit-actions">
          <button type="button" class="btn-save" (click)="saveEdit()" title="Salvar">
            Salvar
          </button>
          <button type="button" class="btn-cancel" (click)="cancelEdit()" title="Cancelar">
            Cancelar
          </button>
        </div>
      </div>
    }
  </div>

  <!-- Ações -->
  @if (!isEditing) {
    <div class="task-actions">
      <button
        type="button"
        class="action-btn edit-btn"
        (click)="startEdit()"
        title="Editar tarefa"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
        </svg>
      </button>

      <button
        type="button"
        class="action-btn delete-btn"
        (click)="remove()"
        title="Remover tarefa"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
    </div>
  }
</li>
