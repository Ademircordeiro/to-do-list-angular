<section class="task-form-card">
  <form (ngSubmit)="onSubmit()" class="task-form">
    <div class="form-main-row">
      <div class="input-wrapper" [class.has-error]="hasError">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        <input
          type="text"
          [(ngModel)]="title"
          (ngModelChange)="onInputChange()"
          name="taskTitle"
          placeholder="Adicione uma nova tarefa..."
          class="task-input"
          autocomplete="off"
        />
      </div>

      <button type="submit" class="btn-submit" [disabled]="!title.trim()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Adicionar</span>
      </button>
    </div>

    @if (hasError) {
      <p class="error-msg">Por favor, digite o título da tarefa antes de adicionar.</p>
    }

    <!-- Opções extras: Prioridade e Categoria -->
    <div class="form-options">
      <!-- Seletor de Prioridade -->
      <div class="option-group">
        <span class="option-label">Prioridade:</span>
        <div class="priority-pills">
          <button
            type="button"
            class="pill-btn priority-baixa"
            [class.active]="priority === 'baixa'"
            (click)="setPriority('baixa')"
          >
            Baixa
          </button>
          <button
            type="button"
            class="pill-btn priority-media"
            [class.active]="priority === 'media'"
            (click)="setPriority('media')"
          >
            Média
          </button>
          <button
            type="button"
            class="pill-btn priority-alta"
            [class.active]="priority === 'alta'"
            (click)="setPriority('alta')"
          >
            Alta
          </button>
        </div>
      </div>

      <!-- Seletor de Categoria -->
      <div class="option-group">
        <span class="option-label">Categoria:</span>
        @if (!showCategoryCustom) {
          <div class="category-pills">
            @for (cat of defaultCategories; track cat) {
              <button
                type="button"
                class="pill-btn category-pill"
                [class.active]="category === cat"
                (click)="setCategory(cat)"
              >
                {{ cat }}
              </button>
            }
            <button
              type="button"
              class="pill-btn category-add"
              (click)="enableCustomCategory()"
              title="Outra categoria"
            >
              + Outra
            </button>
          </div>
        } @else {
          <div class="custom-category-box">
            <input
              type="text"
              [(ngModel)]="category"
              name="customCategory"
              placeholder="Nome da categoria"
              class="custom-cat-input"
            />
            <button
              type="button"
              class="pill-btn"
              (click)="showCategoryCustom = false"
            >
              OK
            </button>
          </div>
        }
      </div>
    </div>
  </form>
</section>
